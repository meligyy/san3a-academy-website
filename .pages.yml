- name: news
  label: News & events
  type: collection
  path: src/content/news
  format: json
  view:
    fields:
    - slug
    - date
    - kind
    primary: slug
  fields:
  - name: slug
    type: string
    required: true
  - name: date
    type: date
    required: true
  - name: kind
    type: select
    options:
      values:
      - news
      - event
  - name: eventDate
    label: Event date
    type: date
  - name: published
    type: boolean
    default: true
  - name: image
    type: image
  - name: title
    type: object
    fields:
    - name: en
      type: string
    - name: ar
      type: string
  - name: summary
    type: object
    fields:
    - name: en
      type: text
    - name: ar
      type: text
  - name: body
    type: object
    fields:
    - name: en
      type: rich-text
    - name: ar
      type: rich-text
  - name: link
    label: Button link
    type: string
  - name: linkLabel
    type: object
    fields:
    - name: en
      type: string
    - name: ar
      type: string
- name: stories
  label: Alumni stories & testimonials
  description: Only publish quotes and photos with written consent.
  type: collection
  path: src/content/stories
  format: json
  view:
    fields:
    - slug
    - audience
    - published
    primary: slug
  fields:
  - name: slug
    type: string
    required: true
  - name: published
    label: Published (consent confirmed)
    type: boolean
  - name: order
    type: number
  - name: audience
    type: select
    options:
      values:
      - kids
      - youth
      - educators
  - name: program
    label: Program slug
    type: string
  - name: name
    type: object
    fields:
    - name: en
      type: string
    - name: ar
      type: string
  - name: role
    type: object
    fields:
    - name: en
      type: string
    - name: ar
      type: string
  - name: quote
    type: object
    fields:
    - name: en
      type: text
    - name: ar
      type: text
  - name: story
    type: object
    fields:
    - name: en
      type: text
    - name: ar
      type: text
