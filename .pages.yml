      type: string
    - name: price
      type: string
    - name: priceNote
      label: Price note
      type: text
    - name: ctaLabel
      label: Apply button label
      type: string
    - name: overviewTitle
      type: string
    - name: overview
      label: Overview (rich text)
      type: rich-text
    - name: learn
      label: What you'll learn
      type: string
      list: true
    - name: skills
      label: Skills & tools
      type: string
      list: true
    - name: outcomes
      label: Outcome stats
      type: object
      list: true
      fields:
      - name: n
        label: Number
        type: string
      - name: label
        type: string
    - name: outcomesSource
      label: Outcomes source
      type: string
    - name: syllabusTitle
      type: string
    - name: syllabusLead
      type: text
    - name: modules
      label: Syllabus modules
      type: object
      list: true
      fields:
      - name: n
        label: Number
