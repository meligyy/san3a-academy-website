# Pages CMS configuration — https://pagescms.org
# Open https://app.pagescms.org, sign in with GitHub, pick this repository.
# Every save is a commit to `main`, and GitHub Actions rebuilds and redeploys the site automatically.

media:
  input: public/images
  output: /images
  categories:
  - image
content:
- name: programs
  label: Programs
  type: collection
  path: src/content/programs
  format: json
  view:
    fields:
    - slug
    - audience
    - type
    - status
    primary: slug
    sort:
    - slug
  fields:
  - name: slug
    label: URL slug (e.g. esp32-for-beginners)
    type: string
    required: true
  - name: order
    label: Sort order
    type: number
  - name: published
    label: Published
    type: boolean
    default: true
  - name: featured
    label: Featured on home page
    type: boolean
  - name: audience
    label: Audience
    type: select
    options:
      values:
      - kids
      - youth
      - educators
  - name: type
    label: Type
    type: select
    options:
      values:
      - diploma
      - bootcamp
      - course
      - workshop
      - scholarship
      - studio
      - fellowship
  - name: format
    label: Format
    type: select
    options:
      values:
      - inperson
      - hybrid
      - online
  - name: status
    label: Status
    type: select
    options:
      values:
      - open
      - rolling
      - soon
      - waitlist
      - closed
  - name: commercial
    label: Paid product (shows live stats)
    type: boolean
  - name: funded
    label: Fully funded / free
    type: boolean
  - name: liveKey
    label: Live stats key (usually = slug)
    type: string
  - name: image
    label: Hero image
    type: image
  - name: tally
    label: Application form (Tally)
    type: object
    fields:
    - name: form
      label: Form key (bootcamps, makerDiploma, girlsMake, eduMakers, studios) or a Tally form id
      type: string
    - name: product
      label: Pre-selected product (exact answer text in the form)
      type: string
  - name: nextRound
    label: Next round (fallback when the live API has no data)
    type: object
    fields:
    - name: start
      label: Start date
      type: date
    - name: capacity
      label: Seats
      type: number
    - name: seatsLeft
      label: Seats left
      type: number
  - name: related
    label: Related program slugs
    type: string
    list: true
  - name: en
    label: English
    type: object
    fields:
    - name: title
      type: string
      required: true
    - name: short
      label: Card summary
      type: text
    - name: seoTitle
      label: SEO title
      type: string
    - name: seoDescription
      label: SEO description (≤ 158 chars)
      type: text
    - name: tagline
      type: string
    - name: summary
      type: text
    - name: imageAlt
      label: Image description
      type: string
    - name: duration
      type: string
    - name: formatLabel
      label: Format label override
      type: string
    - name: level
      label: Level / age
      type: string
    - name: nextStart
      label: Next start (text)
      type: string
    - name: location
      type: string
    - name: schedule
      type: string
    - name: language
      type: string
    - name: price
      type: string
    - name: priceNote
      label: Price note
      type: text
    - name: ctaLabel
      label: Apply button label
      type: string
    - name: overviewTitle
      type: string
    - name: overview
      label: Overview (rich text)
      type: rich-text
    - name: learn
      label: What you'll learn
      type: string
      list: true
    - name: skills
      label: Skills & tools
      type: string
      list: true
    - name: outcomes
      label: Outcome stats
      type: object
      list: true
      fields:
      - name: n
        label: Number
        type: string
      - name: label
        type: string
    - name: outcomesSource
      label: Outcomes source
      type: string
    - name: syllabusTitle
      type: string
    - name: syllabusLead
      type: text
    - name: modules
      label: Syllabus modules
      type: object
      list: true
      fields:
      - name: n
        label: Number
        type: number
      - name: title
        type: string
      - name: meta
        label: Week / subtitle
        type: string
      - name: summary
        type: text
      - name: topics
        type: string
        list: true
    - name: projectsTitle
      type: string
    - name: projects
      type: object
      list: true
      fields:
      - name: title
        type: string
      - name: body
        type: text
    - name: whoTitle
      type: string
    - name: whoFor
      label: Who it's for
      type: string
      list: true
    - name: requirements
      label: What you need
      type: string
      list: true
    - name: fees
      type: object
      fields:
      - name: title
        type: string
      - name: body
        type: text
      - name: items
        type: string
        list: true
    - name: testimonial
      type: object
      fields:
      - name: quote
        type: text
      - name: name
        type: string
      - name: role
        type: string
    - name: applyTitle
      type: string
    - name: applyLead
      type: text
    - name: applySteps
      label: How to apply (steps)
      type: object
      list: true
      fields:
      - name: title
        type: string
      - name: body
        type: text
    - name: faq
      label: FAQ
      type: object
      list: true
      fields:
      - name: q
        label: Question
        type: string
      - name: a
        label: Answer
        type: text
