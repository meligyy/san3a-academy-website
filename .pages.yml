- name: blog-en
  label: Blog — English
  type: collection
  path: src/content/blog/en
  format: yaml-frontmatter
  filename: '{fields.slug}.md'
  view:
    fields:
    - title
    - category
    - date
    primary: title
    sort:
    - date
    default:
      sort: date
      order: desc
  fields:
  - name: title
    type: string
    required: true
  - name: description
    label: Meta description (140–158 chars)
    type: text
    required: true
  - name: slug
    type: string
    required: true
  - name: date
    type: date
    required: true
  - name: updated
    type: date
  - name: category
    type: select
    options:
      values:
      - electronics
      - ai
      - fabrication
      - careers
      - kids
      - educators
      - community
  - name: cover
    label: Cover image (1600×900)
    type: image
  - name: coverAlt
    label: Cover description
    type: string
  - name: keywords
    type: string
    list: true
  - name: author
    type: string
  - name: program
    label: Related program slug
    type: string
  - name: related
    label: Related post slugs
    type: string
    list: true
  - name: featured
    type: boolean
  - name: draft
    type: boolean
  - name: faq
    type: object
    list: true
    fields:
    - name: q
      label: Question
      type: string
    - name: a
      label: Answer
      type: text
  - name: body
    label: Article
    type: rich-text
